name: ASan and LSan

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Single FFmpeg ref to test (empty = all three)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
  LSAN_OPTIONS: exitcode=23:report_objects=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  setup:
    name: Select refs
    runs-on: ubuntu-26.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ]; then
            slug=$(printf '%s' "$REF" | tr '/' '-')
            printf 'targets=[{"ref":"%s","slug":"%s"}]\n' "$REF" "$slug"
          else
            printf 'targets=[{"ref":"perf/j2k-dwt","slug":"dwt"},{"ref":"perf/j2k-tier1","slug":"tier1"},{"ref":"ci/j2k-combined","slug":"combined"}]\n'
          fi >> "$GITHUB_OUTPUT"

  linux:
    name: ${{ matrix.arch.name }} ${{ matrix.target.ref }} ASan+LSan
    needs: setup
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.targets) }}
        arch:
          - runner: ubuntu-26.04
            name: x86_64
          - runner: ubuntu-26.04-arm
            name: arm64
    steps:
      - name: Check out ${{ matrix.target.ref }}
        uses: actions/checkout@v7.0.1
        with:
          repository: justsrc/FFmpeg
          ref: ${{ matrix.target.ref }}
          path: ffmpeg
          fetch-depth: 1
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld nasm yasm pkg-config ffmpeg \
            libopenjp2-tools

      - name: Configure
        working-directory: ffmpeg
        run: |
          ./configure \
            --toolchain=clang-asan \
            --disable-everything \
            --enable-demuxer=image2pipe \
            --enable-parser=jpeg2000 \
            --enable-decoder=jpeg2000 \
            --enable-encoder=wrapped_avframe \
            --enable-muxer=null \
            --enable-protocol=file \
            --enable-protocol=pipe \
            --disable-autodetect \
            --disable-doc \
            --disable-stripping \
            --extra-cflags='-O1 -g -fno-omit-frame-pointer'

      - name: Build
        working-directory: ffmpeg
        run: |
          make -j"$(nproc)" \
            ffmpeg \
            libavcodec/tests/jpeg2000dwt \
            tests/checkasm/checkasm
          if [ -f libavcodec/tests/mqc.c ]; then
            make -j"$(nproc)" libavcodec/tests/mqc
          fi

      - name: Verify LSan detects a deliberate leak
        run: |
          mkdir -p logs
          printf '#include <stdlib.h>\nint main(void) { malloc(16); return 0; }\n' > /tmp/leak.c
          clang -fsanitize=address -g /tmp/leak.c -o /tmp/leak
          if output=$(/tmp/leak 2>&1); then
            echo "::error::LSan did not fail on a deliberate leak"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -q 'LeakSanitizer' <<<"$output"
          echo "LSan is active"

      - name: Generate JPEG 2000 samples
        run: |
          mkdir -p samples logs
          enc() { ffmpeg -nostdin -v error "$@"; }

          enc -f lavfi -i testsrc2=size=512x512:rate=1 -frames:v 1 \
            -pix_fmt rgb24 -c:v jpeg2000 -pred dwt53 -format j2k \
            samples/rgb8_dwt53_512.j2k
          enc -f lavfi -i testsrc2=size=1024x768:rate=1 -frames:v 1 \
            -pix_fmt rgb48le -c:v jpeg2000 -pred dwt97int -format j2k \
            samples/rgb16_dwt97_1024x768.j2k
          enc -f lavfi -i testsrc2=size=800x600:rate=1 -frames:v 1 \
            -pix_fmt gbrp12le -c:v jpeg2000 -pred dwt97int -format j2k \
            samples/gbr12_dwt97_800x600.j2k
          enc -f lavfi -i testsrc2=size=100x90:rate=1 -frames:v 1 \
            -pix_fmt gray12le -c:v jpeg2000 -pred dwt97int -format j2k \
            samples/gray12_dwt97_100x90.j2k
          enc -f lavfi -i testsrc2=size=1024x768:rate=1 -frames:v 1 \
            -pix_fmt rgb24 -c:v jpeg2000 -pred dwt53 \
            -tile_width 256 -tile_height 256 -format j2k \
            samples/rgb8_dwt53_tiled_1024x768.j2k
          enc -f lavfi -i testsrc2=size=640x480:rate=1 -frames:v 1 \
            -pix_fmt gbrp12le -c:v jpeg2000 -pred dwt97int -format jp2 \
            -f image2 samples/gbr12_dwt97_640x480.jp2
          enc -f lavfi -i testsrc2=size=4096x1714:rate=1 -frames:v 3 \
            -pix_fmt gbrp12le -c:v jpeg2000 -pred dwt97int \
            -f image2 -format j2k samples/gbr12_dwt97_4096x1714_%03d.j2k

          # The native encoder only writes the integer 9/7 transform; the
          # decoder's float 9/7 path and the packed 16-bit writer need an
          # irreversible OpenJPEG codestream.
          enc -f lavfi -i testsrc2=size=1024x768:rate=1 -frames:v 1 \
            -pix_fmt rgb48le samples/float97_src.png
          opj_compress -i samples/float97_src.png \
            -o samples/rgb16_float97_1024x768.j2k -I -r 20
          rm -f samples/float97_src.png

          ls -l samples

      - name: Decode samples under ASan and LSan
        working-directory: ffmpeg
        run: |
          set -uo pipefail
          fail=0
          for f in ../samples/*.j2k ../samples/*.jp2; do
            name=$(basename "$f")
            for threads in 1 4 8; do
              echo "::group::$name threads=$threads"
              if ! ./ffmpeg -nostdin -v error -xerror -threads "$threads" \
                   -f image2pipe -c:v jpeg2000 -i "$f" -f null - \
                   2>&1 | tee "../logs/${name}.t${threads}.log"; then
                echo "::error::$name failed with threads=$threads"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$fail"

      - name: Decode the float 9/7 sample with packed output
        working-directory: ffmpeg
        run: |
          set -uo pipefail
          for threads in 1 8; do
            echo "::group::rgb16_float97 packed threads=$threads"
            ./ffmpeg -nostdin -v error -xerror -threads "$threads" \
              -f image2pipe -c:v jpeg2000 \
              -i ../samples/rgb16_float97_1024x768.j2k \
              -pix_fmt rgb48le -f null - \
              2>&1 | tee "../logs/rgb16_float97_packed.t${threads}.log"
            echo "::endgroup::"
          done

      - name: Download the 4K DCP corpus
        run: |
          curl -fsSL --retry 3 \
            -o corpus.j2kpipe \
            https://github.com/justsrc/ffmpeg-j2k-asan-lsan/releases/download/j2k-corpus-2026-11-27/corpus.j2kpipe
          echo "f19a668d861c41745ab644fc0df7557c1c7974de89a9d441c5d389b8b21a42ae  corpus.j2kpipe" \
            | sha256sum -c -

      - name: Decode the 4K DCP corpus under ASan and LSan
        working-directory: ffmpeg
        run: |
          set -uo pipefail
          fail=0
          for threads in 1 4 8; do
            echo "::group::corpus 4096x1714 xyz12 threads=$threads"
            if ! ./ffmpeg -nostdin -v error -xerror -threads "$threads" \
                 -f image2pipe -c:v jpeg2000 -i ../corpus.j2kpipe \
                 -progress "../logs/corpus.t${threads}.progress" \
                 -f null - 2>&1 | tee "../logs/corpus.t${threads}.log"; then
              echo "::error::4K corpus failed with threads=$threads"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Verify the corpus decoded all 240 frames
        if: always()
        working-directory: ffmpeg
        run: |
          fail=0
          for threads in 1 4 8; do
            progress="../logs/corpus.t${threads}.progress"
            if ! grep -qx 'frame=240' "$progress" ||
               ! grep -qx 'progress=end' "$progress"; then
              echo "::error::corpus threads=$threads did not reach frame 240"
              tail -5 "$progress" 2>/dev/null || true
              fail=1
            fi
          done
          exit "$fail"

      - name: Run the DWT and MQ reference tests
        working-directory: ffmpeg
        run: |
          set -o pipefail
          ./libavcodec/tests/jpeg2000dwt 2>&1 | tee ../logs/jpeg2000dwt.log
          if [ -x ./libavcodec/tests/mqc ]; then
            ./libavcodec/tests/mqc 2>&1 | tee ../logs/mqc.log
          fi

      - name: Run the JPEG 2000 DSP checkasm test
        working-directory: ffmpeg
        run: |
          set -o pipefail
          ./tests/checkasm/checkasm --test=jpeg2000dsp \
            2>&1 | tee ../logs/checkasm-jpeg2000dsp.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asan-lsan-${{ matrix.arch.name }}-${{ matrix.target.slug }}
          path: logs/
          if-no-files-found: warn

  fate:
    name: ${{ matrix.arch.name }} ${{ matrix.target.ref }} FATE+LSan
    needs: setup
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.targets) }}
        arch:
          - runner: ubuntu-26.04
            name: x86_64
          - runner: ubuntu-26.04-arm
            name: arm64
    steps:
      - name: Check out ${{ matrix.target.ref }}
        uses: actions/checkout@v7.0.1
        with:
          repository: justsrc/FFmpeg
          ref: ${{ matrix.target.ref }}
          path: ffmpeg
          fetch-depth: 1
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld nasm yasm pkg-config

      - name: Configure
        working-directory: ffmpeg
        run: |
          ./configure \
            --toolchain=clang-asan \
            --disable-everything \
            --enable-demuxer=image2 \
            --enable-demuxer=image2pipe \
            --enable-demuxer=image_j2k_pipe \
            --enable-demuxer=mxf \
            --enable-parser=jpeg2000 \
            --enable-decoder=jpeg2000 \
            --enable-encoder=pcm_s16le \
            --enable-encoder=rawvideo \
            --enable-muxer=framecrc \
            --enable-muxer=null \
            --enable-filter=scale \
            --enable-swscale \
            --enable-protocol=file \
            --enable-protocol=pipe \
            --disable-autodetect \
            --disable-doc \
            --disable-stripping \
            --extra-cflags='-O1 -g -fno-omit-frame-pointer'

      - name: Build
        working-directory: ffmpeg
        run: make -j"$(nproc)" ffmpeg ffprobe

      - name: Download the ITU-T T.803 conformance samples
        run: |
          mkdir -p fate-suite/jpeg2000/itu-iso/codestreams_profile0 \
                   fate-suite/jpeg2000/itu-iso/htj2k_bsets_profile0 logs
          base=https://fate-suite.ffmpeg.org/jpeg2000
          for n in 01 02 03 04 05 07 08 09 10 11 12 14 15 16; do
            curl -fsSL --retry 3 \
              "$base/itu-iso/codestreams_profile0/p0_${n}.j2k" \
              -o "fate-suite/jpeg2000/itu-iso/codestreams_profile0/p0_${n}.j2k"
          done
          curl -fsSL --retry 3 \
            "$base/itu-iso/htj2k_bsets_profile0/ds0_ht_01_b11.j2k" \
            -o fate-suite/jpeg2000/itu-iso/htj2k_bsets_profile0/ds0_ht_01_b11.j2k
          curl -fsSL --retry 3 \
            "$base/chiens_dcinema2K.mxf" \
            -o fate-suite/jpeg2000/chiens_dcinema2K.mxf
          du -sh fate-suite

      - name: Run the JPEG 2000 FATE tests under ASan and LSan
        working-directory: ffmpeg
        run: |
          set -o pipefail
          make fate-jpeg2000dec SAMPLES="$PWD/../fate-suite" \
            2>&1 | tee ../logs/fate-jpeg2000dec.log

      - name: Collect the FATE reports
        if: always()
        working-directory: ffmpeg
        run: |
          mkdir -p ../logs/fate-reports
          cp -a tests/data/fate/. ../logs/fate-reports/ 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fate-${{ matrix.arch.name }}-${{ matrix.target.slug }}
          path: logs/
          if-no-files-found: warn

  fuzz:
    name: ${{ matrix.arch.name }} ${{ matrix.target.ref }} fuzz+LSan
    needs: setup
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.targets) }}
        arch:
          - runner: ubuntu-26.04
            name: x86_64
          - runner: ubuntu-26.04-arm
            name: arm64
    steps:
      - name: Check out ${{ matrix.target.ref }}
        uses: actions/checkout@v7.0.1
        with:
          repository: justsrc/FFmpeg
          ref: ${{ matrix.target.ref }}
          path: ffmpeg
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the harness scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld nasm yasm pkg-config

      - name: Configure
        working-directory: ffmpeg
        run: |
          ./configure \
            --toolchain=clang-asan \
            --disable-everything \
            --enable-demuxer=image2pipe \
            --enable-parser=jpeg2000 \
            --enable-decoder=jpeg2000 \
            --enable-encoder=wrapped_avframe \
            --enable-muxer=null \
            --enable-protocol=file \
            --enable-protocol=pipe \
            --disable-autodetect \
            --disable-doc \
            --disable-stripping \
            --extra-cflags='-O1 -g -fno-omit-frame-pointer'

      - name: Build
        working-directory: ffmpeg
        run: make -j"$(nproc)" ffmpeg

      - name: Verify LSan detects a deliberate leak
        run: |
          mkdir -p logs
          printf '#include <stdlib.h>\nint main(void) { malloc(16); return 0; }\n' > /tmp/leak.c
          clang -fsanitize=address -g /tmp/leak.c -o /tmp/leak
          if output=$(/tmp/leak 2>&1); then
            echo "::error::LSan did not fail on a deliberate leak"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -q 'LeakSanitizer' <<<"$output"
          echo "LSan is active"

      - name: Download the malformed corpus
        run: |
          curl -fsSL --retry 3 \
            -o fuzz-corpus.tar.gz \
            https://github.com/justsrc/ffmpeg-j2k-asan-lsan/releases/download/j2k-fuzz-corpus-2026-11-27/j2k-fuzz-corpus.tar.gz
          echo "8fd38e74779bb41f6e4ba44d5839a578b3917e430b5dc63fd3fd40e735c10667  fuzz-corpus.tar.gz" \
            | sha256sum -c -
          tar -xzf fuzz-corpus.tar.gz
          find fuzz-corpus -name '._*' -delete
          echo "inputs=$(find fuzz-corpus -type f | wc -l)"

      - name: Run the malformed corpus under ASan and LSan
        run: |
          set -o pipefail
          python3 harness/scripts/fuzz-lsan.py \
            "$PWD/ffmpeg/ffmpeg" "$PWD/fuzz-corpus" "$PWD/logs/fuzz-lsan.json" \
            2>&1 | tee logs/fuzz-lsan.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-${{ matrix.arch.name }}-${{ matrix.target.slug }}
          path: logs/
          if-no-files-found: warn
